<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciodarofitness - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .bg-\[\#131b2e\] { background-color: #131b2e !important; border: 1px solid rgba(249, 115, 22, 0.4) !important; }
            .bg-\[\#0b0f19\] { background-color: #0b0f19 !important; }
            .text-white { color: #ffffff !important; font-weight: 800 !important; }
            .text-gray-200, .text-gray-300, .text-gray-400 { color: #e2e8f0 !important; font-weight: 700 !important; }
            .text-orange-400, .text-orange-500 { color: #f97316 !important; font-weight: 900 !important; }
            .text-emerald-400 { color: #34d399 !important; font-weight: 800 !important; }
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-5" id="app-container">
        <div id="vista-principal" class="space-y-5">
            <header class="flex justify-between items-center bg-[#131b2e] p-4 rounded-2xl border border-gray-800 shadow-lg">
                <div>
                    <h1 class="text-lg font-black text-white tracking-wide">CIODAROFITNESS <span class="text-xs text-orange-500 font-normal">pro</span></h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="alternarVisibilidadMontos()" id="btn-ojo" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-xl border border-gray-700 text-xs transition">👁️</button>
                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold px-3 py-1 rounded-full">Activo</span>
                </div>
            </header>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#131b2e] p-3.5 rounded-2xl border border-gray-800">
                    <div class="text-[10px] text-gray-400 uppercase font-semibold">Atletas Activos</div>
                    <div id="total-clientes" class="text-2xl font-black mt-1 text-white">0</div>
                </div>
                <div class="bg-[#131b2e] p-3.5 rounded-2xl border border-gray-800">
                    <div class="text-[10px] text-gray-400 uppercase font-semibold">Meta Mensual</div>
                    <div id="total-meta" class="text-xl font-black mt-1 text-orange-400">$0.00</div>
                </div>
                <div class="bg-[#131b2e] p-3.5 rounded-2xl border border-gray-800">
                    <div class="text-[10px] text-gray-400 uppercase font-semibold">Recaudado</div>
                    <div id="total-recaudado" class="text-xl font-black mt-1 text-emerald-400">$0.00</div>
                </div>
                <div class="bg-[#131b2e] p-3.5 rounded-2xl border border-gray-800">
                    <div class="text-[10px] text-gray-400 uppercase font-semibold">Por Cobrar</div>
                    <div id="total-por-cobrar" class="text-xl font-black mt-1 text-amber-400">$0.00</div>
                </div>
            </div>

            <div class="bg-[#131b2e] p-5 rounded-3xl border border-gray-800 space-y-3 shadow-xl no-print">
                <h2 class="text-xs font-bold text-orange-500 uppercase tracking-wider flex items-center gap-1.5">
                    ⚡ Registrar Nuevo Atleta
                </h2>
                
                <form id="form-cliente" class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Edad</label>
                            <input type="number" id="edad" placeholder="Ej. 30" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">WhatsApp</label>
                            <input type="text" id="whatsapp" required placeholder="Ej. 5841234" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Costo Paquete ($)</label>
                            <input type="number" id="costo" required placeholder="Ej. 50" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Fecha de Inicio</label>
                            <input type="date" id="fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-orange-600/20">
                        📂 Agregar a la Base de Datos
                    </button>
                </form>
            </div>

            <div class="space-y-3 no-print">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                        📋 Control de Atletas
                    </h3>
                </div>
                <div>
                    <input type="text" id="buscador-clientes" oninput="renderizarClientes()" placeholder="🔍 Buscar atleta por nombre..." class="w-full bg-[#131b2e] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 shadow-md">
                </div>
                <div id="lista-clientes" class="space-y-3"></div>
            </div>
        </div>

        <div id="vista-expediente" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print">
                <button onclick="volverAlInicio()" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl border border-gray-700 transition">
                    ← Volver al Panel
                </button>
                <button onclick="generarPDFExpediente()" class="bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg flex items-center gap-1.5 transition">
                    ⚡ Descargar Expediente PDF
                </button>
            </div>
            
            <div class="bg-gradient-to-r from-orange-600 to-amber-600 p-5 rounded-2xl shadow-xl text-white text-center space-y-1">
                <h1 class="text-xl font-black tracking-wider">CIODAROFITNESS</h1>
                <p class="text-xs font-semibold uppercase tracking-widest text-orange-100">Expediente Antropométrico & Rendimiento</p>
                <div class="text-[10px] text-orange-200 pt-1" id="fecha-impresion"></div>
            </div>

            <div id="detalle-expediente" class="space-y-4"></div>

            <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800 text-center space-y-1 mt-6">
                <p class="text-xs font-bold text-orange-500">CIODAROFITNESS</p>
                <p class="text-[10px] text-gray-400">Entrenamiento Inteligente</p>
            </div>
        </div>
    </div>

    <script>
        const inputFecha = document.getElementById('fecha');
        if (inputFecha) {
            inputFecha.valueAsDate = new Date();
        }

        let clientes = JSON.parse(localStorage.getItem('ciodaro_clientes')) || [];
        let montosOcultos = false;
        let metricaEditandoIdx = null;
        let clienteActualId = null;

        function guardarStorage() {
            localStorage.setItem('ciodaro_clientes', JSON.stringify(clientes));
            renderizarClientes();
        }

        function alternarVisibilidadMontos() {
            montosOcultos = !montosOcultos;
            document.getElementById('btn-ojo').textContent = montosOcultos ? '🙈' : '👁️';
            renderizarClientes();
        }

        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombreVal = document.getElementById('nombre').value;
            const edadVal = document.getElementById('edad').value || 'N/A';
            const whatsappVal = document.getElementById('whatsapp').value;
            const costoVal = parseFloat(document.getElementById('costo').value) || 0;
            const fechaVal = document.getElementById('fecha').value;

            const nuevoCliente = {
                id: Date.now(),
                nombre: nombreVal,
                edad: edadVal,
                whatsapp: whatsappVal,
                costo: costoVal,
                fecha: fechaVal,
                pagado: true,
                abonos: [],
                metricas: []
            };

            clientes.push(nuevoCliente);
            guardarStorage();
            
            this.reset();
            document.getElementById('fecha').valueAsDate = new Date();
        });

        function eliminarCliente(id) {
            if(confirm('¿Eliminar este atleta por completo?')) {
                clientes = clientes.filter(c => c.id !== id);
                guardarStorage();
            }
        }

        function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            const inputBusqueda = document.getElementById('buscador-clientes');
            const textoFiltro = inputBusqueda ? inputBusqueda.value.toLowerCase() : '';
            const clientesFiltrados = clientes.filter(c => c.nombre.toLowerCase().includes(textoFiltro));

            let totalCli = clientes.length;
            let metaTotal = 0;
            let recaudadoTotal = 0;
            let porCobrarTotal = 0;

            clientes.forEach(c => {
                metaTotal += Number(c.costo) || 0;
                let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + (Number(a.monto) || 0), 0);
                let pagadoReal = c.pagado || (totalAbonado >= c.costo);
                
                if (pagadoReal) {
                    recaudadoTotal += Number(c.costo) || 0;
                } else {
                    recaudadoTotal += totalAbonado;
                    porCobrarTotal += ((Number(c.costo) || 0) - totalAbonado);
                }
            });

            document.getElementById('total-clientes').textContent = totalCli;
            document.getElementById('total-meta').textContent = montosOcultos ? '••••' : '$' + metaTotal.toFixed(2);
            document.getElementById('total-recaudado').textContent = montosOcultos ? '••••' : '$' + recaudadoTotal.toFixed(2);
            document.getElementById('total-por-cobrar').textContent = montosOcultos ? '••••' : '$' + porCobrarTotal.toFixed(2);

            if (clientesFiltrados.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-500 text-sm py-6 bg-[#131b2e] rounded-2xl border border-gray-800">No se encontraron atletas.</div>`;
                return;
            }

            clientesFiltrados.forEach(c => {
                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                let fechaVenc = new Date(fechaInicio);
                fechaVenc.setDate(fechaVenc.getDate() + 30);
                let opt = { day: '2-digit', month: 'short' };

                let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + (Number(a.monto) || 0), 0);
                let pagadoReal = c.pagado || (totalAbonado >= c.costo);

                const card = document.createElement('div');
                card.className = "bg-[#131b2e] p-4 rounded-2xl border border-gray-800 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-base">${c.nombre}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">📅 Ciclo: ${fechaInicio.toLocaleDateString('es-ES', opt)} al ${fechaVenc.toLocaleDateString('es-ES', opt)}</p>
                        </div>
                        <span class="text-emerald-400 font-bold text-sm">${montosOcultos ? '••••' : '$' + (Number(c.costo) || 0).toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-800/60">
                        <span class="bg-${pagadoReal ? 'emerald' : 'amber'}-500/10 text-${pagadoReal ? 'emerald' : 'amber'}-400 border border-${pagadoReal ? 'emerald' : 'amber'}-500/20 text-[10px] font-semibold px-2.5 py-1 rounded-full">
                            ${pagadoReal ? 'Al Día (30d)' : `Abonado: $${totalAbonado.toFixed(2)}`}
                        </span>
                        <div class="flex gap-2">
                            <button onclick="abrirExpediente(${c.id})" class="bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition">
                                📂 Expediente
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-gray-800 hover:bg-red-600/20 text-gray-400 hover:text-red-400 p-2 rounded-xl border border-gray-700">🗑️</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }
                function abrirExpediente(id) {
            clienteActualId = id;
            metricaEditandoIdx = null;
            document.getElementById('vista-principal').classList.add('hidden');
            document.getElementById('vista-expediente').classList.remove('hidden');
            renderizarExpediente();
        }

        function volverAlInicio() {
            clienteActualId = null;
            metricaEditandoIdx = null;
            document.getElementById('vista-expediente').classList.add('hidden');
            document.getElementById('vista-principal').classList.remove('hidden');
            renderizarClientes();
        }

        function renderizarExpediente() {
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;

            const contenedor = document.getElementById('detalle-expediente');
            
            let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + (Number(a.monto) || 0), 0);
            let saldoPendiente = (Number(c.costo) || 0) - totalAbonado;
            if (saldoPendiente < 0) saldoPendiente = 0;

            let htmlAbonos = '';
            if (c.abonos && c.abonos.length > 0) {
                c.abonos.forEach((abono, idx) => {
                    htmlAbonos += `
                        <div class="flex justify-between items-center bg-[#0b0f19] p-2.5 rounded-xl border border-gray-800 text-xs">
                            <div>
                                <span class="text-emerald-400 font-bold">$${(Number(abono.monto) || 0).toFixed(2)}</span>
                                <span class="text-gray-400 ml-2">📅 ${abono.fecha}</span>
                            </div>
                            <button onclick="eliminarAbono(${idx})" class="text-red-400 hover:text-red-300 text-[10px] bg-red-950/40 px-2 py-1 rounded no-print">Eliminar</button>
                        </div>
                    `;
                });
            } else {
                htmlAbonos = `<p class="text-gray-500 text-xs text-center py-2">No hay abonos registrados aún.</p>`;
            }

            let htmlMetricas = '';
            if (c.metricas && c.metricas.length > 0) {
                c.metricas.forEach((m, idx) => {
                    htmlMetricas += `
                        <div class="bg-[#131b2e] p-4 rounded-2xl border border-orange-500/30 space-y-2 text-xs shadow-md">
                            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                                <span class="font-bold text-orange-400 text-sm">📅 Registro: ${m.fecha}</span>
                                <div class="flex gap-1 no-print">
                                    <button onclick="editarMetrica(${idx})" class="bg-gray-800 px-2 py-1 rounded text-gray-300">Editar</button>
                                    <button onclick="eliminarMetrica(${idx})" class="bg-red-900/40 text-red-400 px-2 py-1 rounded">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-1 text-gray-200">
                                <div><b>Peso:</b> <span class="text-orange-300">${m.peso} kg</span></div>
                                <div><b>Estatura:</b> ${m.estatura} cm</div>
                                <div><b>IMC:</b> <span class="text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded">${m.imc}</span></div>
                                <div><b>Cuello:</b> ${m.cuello} cm</div>
                                <div><b>Tórax:</b> ${m.torax} cm</div>
                                <div><b>Bíceps:</b> ${m.biceps} cm</div>
                                <div><b>Abdomen:</b> ${m.abdomen} cm</div>
                                <div><b>Glúteos:</b> ${m.gluteos} cm</div>
                                <div><b>Cuádriceps:</b> ${m.cuadriceps} cm</div>
                                <div><b>Pantorrilla:</b> ${m.pantorrilla} cm</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                htmlMetricas = `<p class="text-gray-500 text-xs text-center py-4">No hay registros antropométricos aún.</p>`;
            }

            const numeroLimpio = c.whatsapp ? c.whatsapp.replace(/\D/g, '') : '';
            const mensajeWp = encodeURIComponent(`¡Hola ${c.nombre}! Te escribo de Ciodarofitness para recordarte tu fecha de vencimiento y estatus de pago de tu plan. 💪🔥`);
            const linkWhatsApp = `https://wa.me/${numeroLimpio}?text=${mensajeWp}`;

            const tituloFormMetrica = metricaEditandoIdx !== null ? '✏️ Actualizar Medición Antropométrica' : '📊 Nueva Medición Antropométrica';
            const textoBotonMetrica = metricaEditandoIdx !== null ? 'Actualizar Medición' : 'Registrar y Calcular IMC';

            contenedor.innerHTML = `
                <div class="bg-[#131b2e] p-5 rounded-3xl border border-orange-500/40 space-y-3 shadow-xl">
                    <h2 class="text-lg font-black text-white flex items-center gap-2">🏋️‍♂️ Atleta: <span class="text-orange-400">${c.nombre}</span></h2>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-200 bg-[#0b0f19] p-3.5 rounded-2xl border border-gray-800">
                        <div><b>Edad:</b> ${c.edad} años</div>
                        <div><b>WhatsApp:</b> ${c.whatsapp}</div>
                        <div><b>Inicio:</b> ${c.fecha}</div>
                        <div><b>Paquete:</b> $${(Number(c.costo) || 0).toFixed(2)}</div>
                        <div class="col-span-2 pt-1 border-t border-gray-800 flex justify-between items-center">
                            <span><b>Estatus:</b> <span class="${c.pagado ? 'text-emerald-400 font-bold' : 'text-amber-400'}">${c.pagado ? 'Pagado Total (Al día)' : `Restante: $${saldoPendiente.toFixed(2)}`}</span></span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 no-print">
                        <button onclick="toggleEstadoPago(${c.id})" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 font-semibold py-2.5 rounded-xl text-xs">
                            🔄 (${c.pagado ? 'Marcar Pendiente' : 'Marcar Pago Total'})
                        </button>
                        <a href="${linkWhatsApp}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 px-3 rounded-xl text-xs text-center flex items-center justify-center gap-1.5 shadow-lg">
                            💬 Enviar WhatsApp
                        </a>
                    </div>
                </div>

                <div class="bg-[#131b2e] p-5 rounded-3xl border border-gray-800 space-y-3">
                    <h3 class="text-sm font-bold text-orange-500 uppercase">💵 Registrar Abono Parcial</h3>
                    <form onsubmit="agregarAbono(event)" class="space-y-3 text-xs no-print">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-gray-400 block mb-1">Monto Abono ($)</label>
                                <input type="number" step="0.1" id="monto-abono" required placeholder="Ej. 20" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2.5 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400 block mb-1">📅 Fecha del Abono</label>
                                <input type="date" id="fecha-abono" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2.5 text-white">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-2.5 rounded-xl transition">Agregar Abono</button>
                    </form>
                    <div class="space-y-2 pt-2 border-t border-gray-800">
                        <h4 class="text-xs font-semibold text-gray-400 uppercase">Historial de Abonos:</h4>
                        ${htmlAbonos}
                    </div>
                </div>

                <div class="bg-[#131b2e] p-5 rounded-3xl border border-gray-800 space-y-3 no-print">
                    <h3 class="text-sm font-bold text-orange-500 uppercase">${tituloFormMetrica}</h3>
                    <form id="form-metrica" onsubmit="guardarMetrica(event)" class="space-y-3 text-xs">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-gray-400">Peso (kg)</label>
                                <input type="number" step="0.1" id="m-peso" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400">Estatura (cm)</label>
                                <input type="number" step="1" id="m-estatura" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400">Fecha</label>
                                <input type="date" id="m-fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <div><label class="text-gray-400">Cuello</label><input type="number" step="0.1" id="m-cuello" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Tórax</label><input type="number" step="0.1" id="m-torax" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Bíceps</label><input type="number" step="0.1" id="m-biceps" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Abdomen</label><input type="number" step="0.1" id="m-abdomen" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Glúteos</label><input type="number" step="0.1" id="m-gluteos" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Cuádriceps</label><input type="number" step="0.1" id="m-cuadriceps" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Pantorrilla</label><input type="number" step="0.1" id="m-pantorrilla" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="w-full bg-orange-600 text-white font-bold py-2 rounded-xl">${textoBotonMetrica}</button>
                            ${metricaEditandoIdx !== null ? `<button type="button" onclick="cancelarEdicionMetrica()" class="bg-gray-700 text-white font-bold px-3 py-2 rounded-xl">Cancelar</button>` : ''}
                        </div>
                    </form>
                </div>

                <div class="space-y-3">
                    <h3 class="text-sm font-bold text-orange-400 uppercase tracking-wide">📈 Historial y Comparativa Mensual</h3>
                    ${htmlMetricas}
                </div>
            `;

            if (metricaEditandoIdx !== null && c.metricas && c.metricas[metricaEditandoIdx]) {
                const m = c.metricas[metricaEditandoIdx];
                document.getElementById('m-peso').value = m.peso;
                document.getElementById('m-estatura').value = m.estatura;
                document.getElementById('m-fecha').value = m.fecha;
                document.getElementById('m-cuello').value = m.cuello !== '-' ? m.cuello : '';
                document.getElementById('m-torax').value = m.torax !== '-' ? m.torax : '';
                document.getElementById('m-biceps').value = m.biceps !== '-' ? m.biceps : '';
                document.getElementById('m-abdomen').value = m.abdomen !== '-' ? m.abdomen : '';
                document.getElementById('m-gluteos').value = m.gluteos !== '-' ? m.gluteos : '';
                document.getElementById('m-cuadriceps').value = m.cuadriceps !== '-' ? m.cuadriceps : '';
                document.getElementById('m-pantorrilla').value = m.pantorrilla !== '-' ? m.pantorrilla : '';
            } else {
                const mFechaInput = document.getElementById('m-fecha');
                if (mFechaInput) mFechaInput.valueAsDate = new Date();
            }

            const fechaAbonoInput = document.getElementById('fecha-abono');
            if (fechaAbonoInput) fechaAbonoInput.valueAsDate = new Date();
            
            const lblFecha = document.getElementById('fecha-impresion');
            if (lblFecha) {
                lblFecha.textContent = "Fecha de emisión: " + new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
            }
        }

        function generarPDFExpediente() {
            window.print();
        }

        function toggleEstadoPago(id) {
            const c = clientes.find(item => item.id === id);
            if (c) {
                c.pagado = !c.pagado;
                guardarStorage();
                renderizarExpediente();
            }
        }

        function agregarAbono(e) {
            e.preventDefault();
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;

            const monto = parseFloat(document.getElementById('monto-abono').value) || 0;
            const fecha = document.getElementById('fecha-abono').value;

            if (!c.abonos) c.abonos = [];
            c.abonos.push({ monto, fecha });

            guardarStorage();
            renderizarExpediente();
        }

        function eliminarAbono(idx) {
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;
            c.abonos.splice(idx, 1);
            guardarStorage();
            renderizarExpediente();
        }

        function guardarMetrica(e) {
            e.preventDefault();
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;

            const peso = parseFloat(document.getElementById('m-peso').value) || 0;
            const estatura = parseFloat(document.getElementById('m-estatura').value) || 0;
            
            let imcVal = "0.0";
            if (estatura > 0) {
                const estMetros = estatura / 100;
                imcVal = (peso / (estMetros * estMetros)).toFixed(1);
            }

            const nuevaMetrica = {
                fecha: document.getElementById('m-fecha').value,
                peso: peso,
                estatura: estatura,
                imc: imcVal,
                cuello: document.getElementById('m-cuello').value || '-',
                torax: document.getElementById('m-torax').value || '-',
                biceps: document.getElementById('m-biceps').value || '-',
                abdomen: document.getElementById('m-abdomen').value || '-',
                gluteos: document.getElementById('m-gluteos').value || '-',
                cuadriceps: document.getElementById('m-cuadriceps').value || '-',
                pantorrilla: document.getElementById('m-pantorrilla').value || '-'
            };

            if (!c.metricas) c.metricas = [];

            if (metricaEditandoIdx !== null) {
                c.metricas[metricaEditandoIdx] = nuevaMetrica;
                metricaEditandoIdx = null;
            } else {
                c.metricas.push(nuevaMetrica);
            }

            guardarStorage();
            renderizarExpediente();
        }

        function editarMetrica(idx) {
            metricaEditandoIdx = idx;
            renderizarExpediente();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicionMetrica() {
            metricaEditandoIdx = null;
            renderizarExpediente();
        }

        function eliminarMetrica(idx) {
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;
            c.metricas.splice(idx, 1);
            guardarStorage();
            renderizarExpediente();
        }

        renderizarClientes();
    </script>
</body>
</html>
