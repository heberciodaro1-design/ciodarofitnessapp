<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiodaroFitness | Panel de Control Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        },
                        zinc: {
                            850: '#202022',
                            950: '#121214',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121214; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen font-sans antialiased">

    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-500 p-2.5 rounded-xl shadow-lg shadow-brand-500/20">
                   <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.83 14.83a9.5 9.5 0 01-5.66 0M9 12a3 3 0 116 0 3 3 0 01-6 0zm9.967-3.971A9.75 9.75 0 0120.5 12a9.75 9.75 0 01-3.033 6.971m-12.867 0A9.75 9.75 0 013.5 12a9.75 9.75 0 013.033-6.971M4 9.75V12m16-2.25V12"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">CiodaroFitness</h1>
                    <p class="text-xs text-zinc-400 uppercase tracking-wider font-medium">Entrenamiento Inteligente</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <div class="text-zinc-400 hidden sm:block">Atletas: <span id="total-students" class="font-bold text-white text-base">0</span></div>
                <button id="btn-settings" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl flex items-center gap-2 transition font-medium cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Ajustes
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 xl:col-span-4 space-y-6">
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-xl sticky top-24">
                <h2 class="text-lg font-bold mb-5 text-white flex items-center gap-2.5">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Ficha de Atleta
                </h2>
                
                <div id="student-form" class="space-y-4">
                    <input type="hidden" id="student-id">
                    
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Nombre Completo</label>
                        <input type="text" id="name" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Teléfono</label>
                            <input type="text" id="phone" placeholder="58412..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Estatus Pago</label>
                            <select id="payment-status" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 text-sm">
                                <option value="Al Día">Al Día</option>
                                <option value="Pendiente">Pendiente</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Peso (kg)</label>
                            <input type="number" step="0.1" id="weight" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Altura (cm)</label>
                            <input type="number" id="height" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">IMC</label>
                            <input type="text" id="imc-display" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-3 text-zinc-400 text-sm font-bold bg-zinc-800/40 text-center" value="0.0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-500 mb-1.5 tracking-wider">Notas / Objetivos</label>
                        <textarea id="notes" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 text-sm resize-none" placeholder="Hipertrofia, fuerza..."></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="button" id="btn-save" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-brand-600/20 flex items-center justify-center gap-2 cursor-pointer">
                            Guardar Atleta
                        </button>
                        <button type="button" id="reset-form" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 rounded-xl text-sm transition cursor-pointer">
                            Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-8 xl:col-span-8 bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-xl flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Atletas Registrados
                </h2>
                <input type="text" id="search-student" placeholder="Buscar por nombre..." class="w-full sm:w-64 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-xs font-bold uppercase text-zinc-500">
                            <th class="py-3 px-3">Atleta</th>
                            <th class="py-3 px-3">Antropometría</th>
                            <th class="py-3 px-3">Pago</th>
                            <th class="py-3 px-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-zinc-800/40 text-sm"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">⚙️ Ajustes del Sistema</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
            </div>
            <div class="space-y-3">
                <button id="btn-export" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition text-left flex items-center justify-between cursor-pointer">
                    <span>📥 Exportar Respaldo (JSON)</span>
                    <span class="text-xs text-zinc-400">Guardar copia</span>
                </button>
                <label class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition cursor-pointer flex items-center justify-between">
                    <span>📤 Restaurar Respaldo</span>
                    <span class="text-xs text-zinc-400">Subir archivo</span>
                    <input type="file" id="import-file" accept=".json" class="hidden">
                </label>
                <button id="btn-clear-all" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-medium py-3 px-4 rounded-xl text-sm transition text-left flex items-center justify-between border border-rose-500/20 cursor-pointer">
                    <span>🗑️ Borrar Todos los Datos</span>
                    <span class="text-xs text-rose-300">Reiniciar base</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let students = JSON.parse(localStorage.getItem('ciodarofitness_students')) || [];

            const tableBody = document.getElementById('students-table-body');
            const totalStudentsEl = document.getElementById('total-students');
            const weightInput = document.getElementById('weight');
            const heightInput = document.getElementById('height');
            const imcDisplay = document.getElementById('imc-display');
            const searchInput = document.getElementById('search-student');

            const idInput = document.getElementById('student-id');
            const nameInput = document.getElementById('name');
            const phoneInput = document.getElementById('phone');
            const paymentInput = document.getElementById('payment-status');
            const notesInput = document.getElementById('notes');
            const btnSave = document.getElementById('btn-save');

            const settingsModal = document.getElementById('settings-modal');
            document.getElementById('btn-settings').addEventListener('click', () => settingsModal.classList.remove('hidden'));
            document.getElementById('close-modal').addEventListener('click', () => settingsModal.classList.add('hidden'));

            function calculateIMC() {
                const w = parseFloat(weightInput.value);
                const h = parseFloat(heightInput.value);
                if (w > 0 && h > 0) {
                    const heightM = h / 100;
                    imcDisplay.value = (w / (heightM * heightM)).toFixed(1);
                } else {
                    imcDisplay.value = '0.0';
                }
            }
            weightInput.addEventListener('input', calculateIMC);
            heightInput.addEventListener('input', calculateIMC);

            function renderStudents(filter = '') {
                tableBody.innerHTML = '';
                const filtered = students.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));

                if (filtered.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-zinc-500 text-sm">No hay atletas registrados.</td></tr>`;
                    totalStudentsEl.textContent = students.length;
                    return;
                }

                filtered.forEach((student) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-zinc-800/30 transition-colors";
                    
                    const paymentBadge = student.paymentStatus === 'Al Día' 
                        ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg text-xs font-semibold">Al Día</span>'
                        : '<span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-lg text-xs font-semibold">Pendiente</span>';

                    tr.innerHTML = `
                        <td class="py-3 px-3">
                            <div class="font-bold text-white">${student.name}</div>
                            <div class="text-xs text-zinc-400">${student.phone}</div>
                        </td>
                        <td class="py-3 px-3">
                            <div class="text-xs text-zinc-300">Peso: <strong class="text-white">${student.weight} kg</strong></div>
                            <div class="text-xs text-zinc-500">IMC: ${student.imc || 'N/A'}</div>
                        </td>
                        <td class="py-3 px-3">${paymentBadge}</td>
                        <td class="py-3 px-3 text-right space-x-1">
                            <button onclick="downloadPDF(${student.id})" class="bg-sky-500/20 text-sky-400 hover:bg-sky-500/30 p-2 rounded-xl transition cursor-pointer" title="Generar Planilla PDF">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            </button>
                            <button onclick="sendWhatsApp('${student.phone}', '${student.name}')" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 p-2 rounded-xl transition cursor-pointer" title="WhatsApp">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
                            </button>
                            <button onclick="editStudent(${student.id})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 p-2 rounded-xl transition cursor-pointer" title="Editar">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="deleteStudent(${student.id})" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 p-2 rounded-xl transition cursor-pointer" title="Eliminar">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
                totalStudentsEl.textContent = students.length;
            }

            btnSave.addEventListener('click', () => {
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                const weight = weightInput.value.trim();
                const height = heightInput.value.trim();

                if (!name || !phone || !weight || !height) {
                    alert('Por favor completa los campos principales (Nombre, Teléfono, Peso y Altura).');
                    return;
                }

                const id = idInput.value;
                const paymentStatus = paymentInput.value;
                const imc = imcDisplay.value;
                const notes = notesInput.value.trim();

                if (id) {
                    students = students.map(s => s.id == id ? { id: Number(id), name, phone, paymentStatus, weight, height, imc, notes } : s);
                } else {
                    students.push({ id: Date.now(), name, phone, paymentStatus, weight, height, imc, notes });
                }

                localStorage.setItem('ciodarofitness_students', JSON.stringify(students));
                
                idInput.value = '';
                nameInput.value = '';
                phoneInput.value = '';
                weightInput.value = '';
                heightInput.value = '';
                notesInput.value = '';
                imcDisplay.value = '0.0';
                
                renderStud
