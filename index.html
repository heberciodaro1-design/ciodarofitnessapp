<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiodaroFitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #09090b; color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
        .box { background: #121215; border: 1px solid #27272a; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .box-gold { border: 1px solid rgba(245, 158, 11, 0.2); }
        .input-dark { background: #18181b; border: 1px solid #3f3f46; padding: 11px; width: 100%; border-radius: 10px; color: #fff !important; font-size: 14px; margin-bottom: 8px; transition: all 0.2s; }
        .input-dark:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
        ::placeholder { color: #71717a; }
        .btn { padding: 12px; border-radius: 10px; font-weight: 800; font-size: 13px; text-transform: uppercase; width: 100%; letter-spacing: 0.5px; transition: all 0.2s; }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: #000; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
        .btn-gold:active { transform: scale(0.98); }
        .comp-card { background: #18181b; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid #f59e0b; }
        .hidden-monto { filter: blur(5px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <header class="box box-gold">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="font-black text-amber-500 text-2xl tracking-tight">CIODAROFITNESS</h1>
                <p id="total-alumnos" class="text-[10px] text-zinc-400 uppercase font-extrabold tracking-wider mt-1"></p>
            </div>
            <button onclick="toggleVisibility()" class="text-xs bg-zinc-800/80 hover:bg-zinc-700 text-amber-400 px-3 py-1.5 rounded-lg border border-zinc-700 transition">👁️</button>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-zinc-800/80">
            <div><p class="text-[9px] text-zinc-400 uppercase font-bold tracking-wider">Planes (Mes)</p><span id="val-planes" class="text-md font-black text-amber-100 ${mostrar ? '' : 'hidden-monto'}">$0</span></div>
            <div>
                <p class="text-[9px] text-zinc-400 uppercase font-bold tracking-wider">Recaudado</p>
                <span id="val-recaudado" class="text-md font-black text-emerald-400 ${mostrar ? '' : 'hidden-monto'}">$0</span>
            </div>
            <div><p class="text-[9px] text-zinc-400 uppercase font-bold tracking-wider">Faltante</p><span id="val-faltante" class="text-md font-black text-rose-500 ${mostrar ? '' : 'hidden-monto'}">$0</span></div>
        </div>
        <!-- Indicador comparativo vs. Mes anterior -->
        <div class="mt-3 pt-2.5 border-t border-zinc-800/80 text-[10px] text-zinc-400 flex justify-between items-center">
            <span class="font-bold tracking-wider">VS. MES ANTERIOR:</span>
            <span id="val-comparativa" class="font-bold ${mostrar ? '' : 'hidden-monto'}">$0 (0%)</span>
        </div>
    </header>

    <input type="text" id="busc" onkeyup="render()" placeholder="🔍 Buscar alumno..." class="input-dark">
    <button onclick="abrirModal(null)" class="btn btn-gold mb-4">➕ Nuevo Alumno</button>

    <div id="lista" class="space-y-3"></div>

    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden p-4 overflow-y-auto z-50">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between mb-4 items-center border-b border-zinc-800 pb-3">
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-xs font-bold bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-lg">✕ Cerrar</button>
                <button onclick="borrarCliente()" class="text-xs font-bold text-rose-500 bg-rose-950/30 px-3 py-1.5 rounded-lg border border-rose-900/50">🗑️ BORRAR</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="ex-nom" placeholder="Nombre del Alumno" class="input-dark">
                <input type="text" id="ex-tel" placeholder="WhatsApp / Teléfono" class="input-dark">
                <div>
                    <label class="text-[10px] text-amber-500/90 uppercase font-extrabold tracking-wider block mb-1">Fecha de Ingreso</label>
                    <input type="date" id="ex-ingreso" class="input-dark">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="number" id="ex-edad" placeholder="Edad" class="input-dark">
                    <input type="number" id="ex-peso" placeholder="Peso (kg)" class="input-dark">
                    <input type="number" id="ex-est" placeholder="Estatura (cm)" class="input-dark">
                </div>
                <div class="flex gap-2">
                    <div class="relative w-full">
                        <input type="number" id="ex-plan" placeholder="Valor del Plan ($)" class="input-dark">
                        <button onclick="document.getElementById('ex-plan').value=''" class="absolute right-3 top-3 text-zinc-500 font-bold">✕</button>
                    </div>
                    <button onclick="pagoTotal()" class="btn bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-amber-500/30 w-auto text-[10px] px-4">PAGO TOTAL</button>
                </div>
                
                <div class="box box-gold">
                    <h3 class="text-[10px] uppercase font-bold text-amber-500 tracking-wider mb-2">Historial de Pagos</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="date" id="pago-fecha" class="input-dark text-[10px]">
                        <input type="number" id="pago-monto" placeholder="$" class="input-dark">
                        <button onclick="agregarPago()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white w-auto px-4">ADD</button>
                    </div>
                    <div id="hist-pagos" class="text-xs space-y-1"></div>
                </div>
                
                <div class="box box-gold">
                    <h3 class="text-[10px] uppercase text-amber-500 font-bold tracking-wider mb-3 border-b border-zinc-800 pb-2">ANTROPOMETRÍA</h3>
                    <input type="date" id="m-fecha" class="input-dark text-[10px]">
                    <input type="number" id="m-p" placeholder="Peso (kg)" class="input-dark">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="m-c" placeholder="Cuello" class="input-dark">
                        <input type="number" id="m-t" placeholder="Tórax" class="input-dark">
                        <input type="number" id="m-b" placeholder="Bíceps" class="input-dark">
                        <input type="number" id="m-cin" placeholder="Cintura" class="input-dark">
                        <input type="number" id="m-g" placeholder="Glúteos" class="input-dark">
                        <input type="number" id="m-cuad" placeholder="Cuád." class="input-dark">
                        <input type="number" id="m-pan" placeholder="Pantorrilla" class="input-dark">
                    </div>
                    <button onclick="guardarMetrica()" class="btn btn-gold mt-2 text-[10px]">Guardar y Calcular</button>
                    <h3 class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider mt-6 mb-2">Historial Comparativo</h3>
                    <div id="hist-met" class="mt-2 text-[11px] space-y-2"></div>
                </div>
                <button onclick="guardarCliente()" class="btn bg-zinc-800 hover:bg-zinc-700 text-white border border-zinc-700">GUARDAR TODO</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ciodaro_db')) || [];
        let cur = null;
        let mostrar = false;

        function toggleVisibility() { mostrar = !mostrar; render(); }

        function getMesClave(fechaObj) {
            let a = fechaObj.getFullYear();
            let m = String(fechaObj.getMonth() + 1).padStart(2, '0');
            return `${a}-${m}`;
        }

        function render() {
            let busqueda = document.getElementById('busc').value.toLowerCase();
            
            let hoy = new Date();
            let mesActualClave = getMesClave(hoy);
            
            let fechaMesPasado = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
            let mesPasadoClave = getMesClave(fechaMesPasado);

            let totalPlanes = db.reduce((a, b) => a + parseFloat(b.plan||0), 0);
            
            let totalRecaudadoMes = db.reduce((accClient, client) => {
                let pagosMes = (client.pagos || []).filter(p => p.fecha && p.fecha.startsWith(mesActualClave));
                return accClient + pagosMes.reduce((accPago, p) => accPago + parseFloat(p.monto || 0), 0);
            }, 0);

            let totalRecaudadoMesPasado = db.reduce((accClient, client) => {
                let pagosMesPasado = (client.pagos || []).filter(p => p.fecha && p.fecha.startsWith(mesPasadoClave));
                return accClient + pagosMesPasado.reduce((accPago, p) => accPago + parseFloat(p.monto || 0), 0);
            }, 0);

            let totalFaltanteMes = totalPlanes - totalRecaudadoMes;
            
            let dif = totalRecaudadoMes - totalRecaudadoMesPasado;
            let pct = totalRecaudadoMesPasado > 0 
                ? ((dif / totalRecaudadoMesPasado) * 100).toFixed(0) 
                : (totalRecaudadoMes > 0 ? 100 : 0);
            let simboloPct = pct >= 0 ? `+${pct}%` : `${pct}%`;
            let colorComp = dif >= 0 ? 'text-emerald-400' : 'text-rose-400';

            document.getElementById('val-planes').innerText = `$${totalPlanes}`;
            document.getElementById('val-recaudado').innerText = `$${totalRecaudadoMes}`;
            document.getElementById('val-faltante').innerText = `$${totalFaltanteMes}`;
            document.getElementById('total-alumnos').innerText = `Alumnos: ${db.length}`;
            
            document.getElementById('val-comparativa').innerHTML = `$${totalRecaudadoMesPasado} <span class="${colorComp}">(${simboloPct})</span>`;

            document.getElementById('val-planes').className = `text-md font-black text-amber-100 ${mostrar ? '' : 'hidden-monto'}`;
            document.getElementById('val-recaudado').className = `text-md font-black text-emerald-400 ${mostrar ? '' : 'hidden-monto'}`;
            document.getElementById('val-faltante').className = `text-md font-black text-rose-500 ${mostrar ? '' : 'hidden-monto'}`;
            document.getElementById('val-comparativa').className = `font-bold ${mostrar ? '' : 'hidden-monto'}`;

            let listaFiltrada = db.filter(c => c.nom.toLowerCase().includes(busqueda)).sort((a, b) => {
                let pagadoA = (a.pagos||[]).filter(p => p.fecha && p.fecha.startsWith(mesActualClave)).reduce((x, y) => x + parseFloat(y.monto||0), 0);
                let pagadoB = (b.pagos||[]).filter(p => p.fecha && p.fecha.startsWith(mesActualClave)).reduce((x, y) => x + parseFloat(y.monto||0), 0);
                let sA = parseFloat(a.plan||0) - pagadoA;
                let sB = parseFloat(b.plan||0) - pagadoB;
                return (sB > 0) - (sA > 0);
            });
            
            document.getElementById('lista').innerHTML = listaFiltrada.map((c) => {
                let yaPagadoMes = (c.pagos||[]).filter(p => p.fecha && p.fecha.startsWith(mesActualClave)).reduce((x, y) => x + parseFloat(y.monto||0), 0);
                let saldo = parseFloat(c.plan||0) - yaPagadoMes;
                let textoSaldo = saldo <= 0 ? "Pagado (0)" : `Resta: $${saldo}`;
                let idxOriginal = db.indexOf(c);
                let tlfLink = c.tel ? `<a href="https://wa.me/${c.tel}" target="_blank" class="text-[11px] text-emerald-400 hover:underline font-bold block mt-0.5">💬 ${c.tel}</a>` : '';
                return `
                <div class="box flex justify-between items-center ${saldo > 0 ? 'border-rose-900/40 bg-rose-950/10' : 'border-zinc-800'}">
                    <div>
                        <h3 class="font-bold text-sm text-zinc-100">${c.nom}</h3>
                        ${tlfLink}
                        <span class="text-[10px] ${saldo <= 0 ? 'text-emerald-400' : 'text-rose-400'} font-bold ${mostrar ? '' : 'hidden-monto'}">${textoSaldo}</span>
                    </div>
                    <button onclick="abrirModal(${idxOriginal})" class="bg-zinc-800/80 hover:bg-zinc-700 px-3.5 py-2 rounded-lg font-bold text-[10px] border border-zinc-700 text-amber-400 transition">EXPEDIENTE</button>
                </div>
            `}).join('');
        }
        
        function abrirModal(i) {
            cur = i;
            if(i !== null) {
                document.getElementById('ex-nom').value = db[i].nom;
                document.getElementById('ex-tel').value = db[i].tel || '';
                document.getElementById('ex-ingreso').value = db[i].ingreso || '';
                document.getElementById('ex-edad').value = db[i].edad || '';
                document.getElementById('ex-plan').value = db[i].plan;
                document.getElementById('ex-peso').value = db[i].peso || '';
                document.getElementById('ex-est').value = db[i].est || '';
                renderPagos(); renderMetricas();
            } else { 
                document.getElementById('ex-nom').value = ''; document.getElementById('ex-tel').value = ''; document.getElementById('ex-ingreso').value = ''; document.getElementById('ex-edad').value = ''; document.getElementById('ex-peso').value = ''; document.getElementById('ex-est').value = ''; document.getElementById('ex-plan').value = ''; document.getElementById('hist-pagos').innerHTML = ''; document.getElementById('hist-met').innerHTML = '';
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        function pagoTotal() {
            if(cur === null) { guardarCliente(); }
            let plan = parseFloat(document.getElementById('ex-plan').value || 0);
            let mesActualClave = getMesClave(new Date());
            let yaPagadoMes = (db[cur].pagos||[]).filter(p => p.fecha && p.fecha.startsWith(mesActualClave)).reduce((x, y) => x + parseFloat(y.monto||0), 0);
            let restante = plan - yaPagadoMes;
            if(restante > 0) {
                if(!db[cur].pagos) db[cur].pagos = [];
                db[cur].pagos.push({fecha: new Date().toISOString().split('T')[0], monto: restante});
                localStorage.setItem('ciodaro_db', JSON.stringify(db));
                renderPagos(); render();
            }
        }

        function agregarPago() {
            if(cur === null) { guardarCliente(); }
            let monto = parseFloat(document.getElementById('pago-monto').value);
            let fecha = document.getElementById('pago-fecha').value;
            if(isNaN(monto) || !fecha) return;
            if(!db[cur].pagos) db[cur].pagos = [];
            db[cur].pagos.push({fecha, monto});
            localStorage.setItem('ciodaro_db', JSON.stringify(db));
            renderPagos(); render();
        }

        function borrarPago(idx) { db[cur].pagos.splice(idx, 1); localStorage.setItem('ciodaro_db', JSON.stringify(db)); renderPagos(); render(); }

        function renderPagos() {
            document.getElementById('hist-pagos').innerHTML = (db[cur].pagos||[]).map((p, i) => `<div class="flex justify-between border-b border-zinc-800/60 py-1.5 text-zinc-300"><span>${p.fecha}: <b class="text-emerald-400">$${p.monto}</b></span><button onclick="borrarPago(${i})" class="text-rose-400 hover:text-rose-300">🗑️</button></div>`).join('');
        }

        function guardarMetrica() {
            if(cur === null) { guardarCliente(); }
            let p = parseFloat(document.getElementById('m-p').value) || parseFloat(document.getElementById('ex-peso').value);
            let h = parseFloat(document.getElementById('ex-est').value) / 100;
            let fecha = document.getElementById('m-fecha').value || new Date().toISOString().split('T')[0];
            let met = {
                fecha: fecha,
                p: document.getElementById('m-p').value,
                c: document.getElementById('m-c').value, t: document.getElementById('m-t').value,
                b: document.getElementById('m-b').value, cin: document.getElementById('m-cin').value,
                g: document.getElementById('m-g').value, cuad: document.getElementById('m-cuad').value,
                pan: document.getElementById('m-pan').value,
                imc: (p && h) ? (p / (h * h)).toFixed(1) : 0
            };
            if(!db[cur].met) db[cur].met = [];
            db[cur].met.push(met);
            localStorage.setItem('ciodaro_db', JSON.stringify(db));
            renderMetricas();
        }

        function borrarMetrica(idx) { db[cur].met.splice(idx, 1); localStorage.setItem('ciodaro_db', JSON.stringify(db)); renderMetricas(); }

        function editarMetrica(idx) {
            let m = db[cur].met[idx];
            document.getElementById('m-fecha').value = m.fecha;
            document.getElementById('m-p').value = m.p;
            document.getElementById('m-c').value = m.c;
            document.getElementById('m-t').value = m.t;
            document.getElementById('m-b').value = m.b;
            document.getElementById('m-cin').value = m.cin;
            document.getElementById('m-g').value = m.g;
            document.getElementById('m-cuad').value = m.cuad;
            document.getElementById('m-pan').value = m.pan;
            db[cur].met.splice(idx, 1);
            localStorage.setItem('ciodaro_db', JSON.stringify(db));
            renderMetricas();
        }

        function renderMetricas() {
            document.getElementById('hist-met').innerHTML = (db[cur].met||[]).map((m, i) => `<div class="comp-card">
                <div class="flex justify-between font-bold text-amber-400 mb-1">
                    <span>FECHA: ${m.fecha}</span>
                    <div class="flex gap-2 items-center">
                        <button onclick="editarMetrica(${i})" class="text-sky-400 text-[10px] font-bold">EDITAR</button>
                        <button onclick="borrarMetrica(${i})" class="text-rose-400 text-[10px] font-bold">ELIMINAR</button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-1 text-[11px] text-zinc-300">
                    <span>PESO: <b>${m.p || '-'}</b></span> <span>IMC: <b>${m.imc}</b></span>
                    <span>C: <b>${m.c}</b></span> <span>T: <b>${m.t}</b></span>
                    <span>B: <b>${m.b}</b></span> <span>CI: <b>${m.cin}</b></span>
                    <span>G: <b>${m.g}</b></span> <span>CU: <b>${m.cuad}</b></span>
                    <span>PAN: <b>${m.pan}</b></span> <span></span>
                </div>
            </div>`).join('');
        }

        function borrarCliente() { if(confirm('¿Borrar?')) { db.splice(cur, 1); localStorage.setItem('ciodaro_db', JSON.stringify(db)); document.getElementById('modal').classList.add('hidden'); render(); } }

        function guardarCliente() {
            let datos = { 
                nom: document.getElementById('ex-nom').value, 
                tel: document.getElementById('ex-tel').value,
                ingreso: document.getElementById('ex-ingreso').value,
                edad: document.getElementById('ex-edad').value, 
                plan: document.getElementById('ex-plan').value, 
                peso: document.getElementById('ex-peso').value, 
                est: document.getElementById('ex-est').value
