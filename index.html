<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiodaroFitness - Gestión de Alumnos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4f4',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider text-brand-500">CIODAROFITNESS</span>
                <span class="text-xs bg-zinc-800 text-zinc-400 px-2 py-1 rounded-md font-medium">Entrenamiento Inteligente</span>
            </div>
            <div id="stats-header" class="text-sm text-zinc-400">
                Alumnos activos: <strong id="total-students" class="text-white">0</strong>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Formulario de Registro / Edición -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 h-fit shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Nuevo Alumno / Antropometría
            </h2>
            
            <form id="student-form" class="space-y-4">
                <input type="hidden" id="student-id">
                
                <div>
                    <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Nombre Completo</label>
                    <input type="text" id="name" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Teléfono (WhatsApp)</label>
                        <input type="text" id="phone" placeholder="58412..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Estado Pago</label>
                        <select id="payment-status" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm">
                            <option value="Al Día">Al Día</option>
                            <option value="Pendiente">Pendiente</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Peso (kg)</label>
                        <input type="number" step="0.1" id="weight" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Altura (cm)</label>
                        <input type="number" id="height" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">IMC</label>
                        <input type="text" id="imc-display" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-zinc-400 text-sm font-bold" placeholder="0.0">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-zinc-400 mb-1">Observaciones / Objetivos</label>
                    <textarea id="notes" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors shadow-lg shadow-brand-600/20">Guardar Alumno</button>
                    <button type="button" id="reset-form" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-2 px-3 rounded-lg text-sm transition-colors">Limpiar</button>
                </div>
            </form>
        </section>

        <!-- Listado de Alumnos -->
        <section class="lg:col-span-2 bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Listado de Alumnos Asesorados
                </h2>
                <input type="text" id="search-student" placeholder="Buscar alumno..." class="bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500">
            </div>

            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-zinc-800 text-xs font-semibold uppercase text-zinc-400">
                            <th class="py-3 px-3">Alumno</th>
                            <th class="py-3 px-3">Antropometría</th>
                            <th class="py-3 px-3">Pago</th>
                            <th class="py-3 px-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-zinc-800/50 text-sm">
                        <!-- Los alumnos se cargan dinámicamente vía JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript Lógica -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let students = JSON.parse(localStorage.getItem('ciodarofitness_students')) || [];

            const form = document.getElementById('student-form');
            const tableBody = document.getElementById('students-table-body');
            const totalStudentsEl = document.getElementById('total-students');
            const weightInput = document.getElementById('weight');
            const heightInput = document.getElementById('height');
            const imcDisplay = document.getElementById('imc-display');
            const searchInput = document.getElementById('search-student');

            // Calcular IMC en tiempo real
            function calculateIMC() {
                const w = parseFloat(weightInput.value);
                const h = parseFloat(heightInput.value);
                if (w > 0 && h > 0) {
                    const heightM = h / 100;
                    const imc = (w / (heightM * heightM)).toFixed(1);
                    imcDisplay.value = imc;
                } else {
                    imcDisplay.value = '';
                }
            }

            weightInput.addEventListener('input', calculateIMC);
            heightInput.addEventListener('input', calculateIMC);

            // Renderizar tabla
            function renderStudents(filter = '') {
                tableBody.innerHTML = '';
                const filtered = students.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));

                if (filtered.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-zinc-500">No hay alumnos registrados.</td></tr>`;
                    totalStudentsEl.textContent = students.length;
                    return;
                }

                filtered.forEach((student, index) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-zinc-800/30 transition-colors";
                    
                    const paymentBadge = student.paymentStatus === 'Al Día' 
                        ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-xs font-medium">Al Día</span>'
                        : '<span class='bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded text-xs font-medium'>Pendiente</span>';

                    tr.innerHTML = `
                        <td class="py-3 px-3">
                            <div class="font-bold text-white">${student.name}</div>
                            <div class="text-xs text-zinc-400">${student.phone}</div>
                        </td>
                        <td class="py-3 px-3">
                            <div class="text-xs text-zinc-300">Peso: <strong class="text-white">${student.weight} kg</strong></div>
                            <div class="text-xs text-zinc-400">IMC: ${student.imc || 'N/A'}</div>
                        </td>
                        <td class="py-3 px-3">
                            ${paymentBadge}
                        </td>
                        <td class="py-3 px-3 text-right space-x-2">
                            <button onclick="sendWhatsApp('${student.phone}', '${student.name}')" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 p-1.5 rounded-lg transition-colors" title="Enviar WhatsApp">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"></path></svg>
                            </button>
                            <button onclick="editStudent(${student.id})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 p-1.5 rounded-lg transition-colors" title="Editar">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="deleteStudent(${student.id})" class="bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 p-1.5 rounded-lg transition-colors" title="Eliminar">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                totalStudentsEl.textContent = students.length;
            }

            // Guardar o Actualizar Alumno
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('student-id').value;
                const name = document.getElementById('name').value;
                const phone = document.getElementById('phone').value;
                const paymentStatus = document.getElementById('payment-status').value;
                const weight = document.getElementById('weight').value;
                const height = document.getElementById('height').value;
                const imc = document.getElementById('imc-display').value;
                const notes = document.getElementById('notes').value;

                if (id) {
                    // Editar
                    students = students.map(s => s.id == id ? { id: Number(id), name, phone, paymentStatus, weight, height, imc, notes } : s);
                } else {
                    // Nuevo
                    const newStudent = {
                        id: Date.now(),
                        name,
                        phone,
                        paymentStatus,
                        weight,
                        height,
                        imc,
                        notes
                    };
                    students.push(newStudent);
                }

                localStorage.setItem('ciodarofitness_students', JSON.stringify(students));
                form.reset();
                document.getElementById('student-id').value = '';
                imcDisplay.value = '';
                renderStudents();
            });

            // Editar alumno (cargar en formulario)
            window.editStudent = function(id) {
                const student = students.find(s => s.id === id);
                if (student) {
                    document.getElementById('student-id').value = student.id;
                    document.getElementById('name').value = student.name;
                    document.getElementById('phone').value = student.phone;
                    document.getElementById('payment-status').value = student.paymentStatus;
                    document.getElementById('weight').value = student.weight;
                    document.getElementById('height').value = student.height;
                    document.getElementById('imc-display').value = student.imc || '';
                    document.getElementById('notes').value = student.notes || '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }

            // Eliminar alumno
            window.deleteStudent = function(id) {
                if (confirm('¿Estás seguro de eliminar este alumno?')) {
                    students = students.filter(s => s.id !== id);
                    localStorage.setItem('ciodarofitness_students', JSON.stringify(students));
                    renderStudents();
                }
            }

            // Enviar WhatsApp
            window.sendWhatsApp = function(phone, name) {
                const cleanPhone = phone.replace(/\D/g, '');
                const message = encodeURIComponent(`¡Hola ${name}! Te escribo de CiodaroFitness para revisar tus avances y programar tu rutina inteligente.`);
                window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
            }

            // Búsqueda en vivo
            searchInput.addEventListener('input', (e) => {
                renderStudents(e.target.value);
            });

            // Botón Limpiar
            document.getElementById('reset-form').addEventListener('click', () => {
                form.reset();
                document.getElementById('student-id').value = '';
                imcDisplay.value = '';
            });

            // Render inicial
            renderStudents();
        });
    </script>
</body>
</html>
