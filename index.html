<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciodarofitness - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            div { border-color: #ccc !important; }
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-6" id="app-container">
        <div id="vista-principal" class="space-y-6">
            <header class="flex justify-between items-center bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                <div>
                    <h1 class="text-xl font-black tracking-wider text-orange-500">CIODAROFITNESS <span class="text-xs text-gray-400 font-normal">page</span></h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="alternarVisibilidadMontos()" id="btn-ojo" class="bg-gray-800 text-gray-300 p-2 rounded-xl border border-gray-700 text-xs">👁️</button>
                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold px-3 py-1.5 rounded-full">Panel Activo</span>
                </div>
            </header>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                    <div class="text-xs text-gray-400 uppercase font-semibold">Clientes Activos</div>
                    <div id="total-clientes" class="text-3xl font-bold mt-2">0</div>
                </div>
                <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                    <div class="text-xs text-gray-400 uppercase font-semibold">Meta Mensual</div>
                    <div id="total-meta" class="text-2xl font-bold mt-2 text-orange-400">$0.00</div>
                </div>
                <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                    <div class="text-xs text-gray-400 uppercase font-semibold">Recaudado</div>
                    <div id="total-recaudado" class="text-2xl font-bold mt-2 text-emerald-400">$0.00</div>
                </div>
                <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                    <div class="text-xs text-gray-400 uppercase font-semibold">Por Cobrar</div>
                    <div id="total-por-cobrar" class="text-2xl font-bold mt-2 text-red-400">$0.00</div>
                </div>
            </div>

            <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 space-y-4 no-print">
                <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wide flex items-center gap-2">
                    👤 Registrar Nuevo Cliente
                </h2>
                
                <form id="form-cliente" class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Edad</label>
                            <input type="number" id="edad" placeholder="Ej. 30" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">WhatsApp</label>
                            <input type="text" id="whatsapp" required placeholder="Ej. 5841234" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Costo Paquete ($)</label>
                            <input type="number" id="costo" required placeholder="Ej. 50" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-1">Fecha de Inicio</label>
                            <input type="date" id="fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-orange-600/20">
                        📂 Agregar a la Base de Datos
                    </button>
                </form>
            </div>

            <div class="space-y-3 no-print">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wide flex items-center gap-2">
                    📋 Control de Clientes y Vencimientos
                </h3>
                <div id="lista-clientes" class="space-y-3"></div>
            </div>
        </div>

        <div id="vista-expediente" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print">
                <button onclick="volverAlInicio()" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-4 py-2 rounded-xl border border-gray-700">
                    ← Volver al Panel
                </button>
                <button onclick="generarPDFExpediente()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-lg flex items-center gap-1.5">
                    📄 Descargar Expediente PDF
                </button>
            </div>
            <div id="detalle-expediente" class="space-y-4"></div>
        </div>
    </div>

    <script>
        // Establecer fecha actual por defecto de forma segura
        const inputFecha = document.getElementById('fecha');
        if (inputFecha) {
            inputFecha.valueAsDate = new Date();
        }

        let clientes = JSON.parse(localStorage.getItem('ciodaro_clientes')) || [];
        let montosOcultos = false;

        function guardarStorage() {
            localStorage.setItem('ciodaro_clientes', JSON.stringify(clientes));
            renderizarClientes();
        }

        function alternarVisibilidadMontos() {
            montosOcultos = !montosOcultos;
            document.getElementById('btn-ojo').textContent = montosOcultos ? '🙈' : '👁️';
            renderizarClientes();
        }

        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombreVal = document.getElementById('nombre').value;
            const edadVal = document.getElementById('edad').value || 'N/A';
            const whatsappVal = document.getElementById('whatsapp').value;
            const costoVal = parseFloat(document.getElementById('costo').value) || 0;
            const fechaVal = document.getElementById('fecha').value;

            const nuevoCliente = {
                id: Date.now(),
                nombre: nombreVal,
                edad: edadVal,
                whatsapp: whatsappVal,
                costo: costoVal,
                fecha: fechaVal,
                pagado: true,
                metricas: []
            };

            clientes.push(nuevoCliente);
            guardarStorage();
            
            // Limpiar formulario y restaurar fecha actual de forma segura
            this.reset();
            document.getElementById('fecha').valueAsDate = new Date();
        });

        function eliminarCliente(id) {
            if(confirm('¿Eliminar este atleta por completo?')) {
                clientes = clientes.filter(c => c.id !== id);
                guardarStorage();
            }
        }

        function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            if (!contenedor) return;
            contenedor.innerHTML = '';
            
            let totalCli = clientes.length;
            let metaTotal = 0;
            let recaudadoTotal = 0;
            let porCobrarTotal = 0;

            if (totalCli === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-500 text-sm py-6 bg-[#131b2e] rounded-2xl border border-gray-800">No hay atletas registrados.</div>`;
                document.getElementById('total-clientes').textContent = '0';
                document.getElementById('total-meta').textContent = montosOcultos ? '••••' : '$0.00';
                document.getElementById('total-recaudado').textContent = montosOcultos ? '••••' : '$0.00';
                document.getElementById('total-por-cobrar').textContent = montosOcultos ? '••••' : '$0.00';
                return;
            }

            clientes.forEach(c => {
                metaTotal += c.costo;
                if (c.pagado) {
                    recaudadoTotal += c.costo;
                } else {
                    porCobrarTotal += c.costo;
                }

                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                let fechaVenc = new Date(fechaInicio);
                fechaVenc.setDate(fechaVenc.getDate() + 30);
                let opt = { day: '2-digit', month: 'short' };

                const card = document.createElement('div');
                card.className = "bg-[#131b2e] p-4 rounded-2xl border border-gray-800 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-base">${c.nombre}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">📅 Ciclo: ${fechaInicio.toLocaleDateString('es-ES', opt)} al ${fechaVenc.toLocaleDateString('es-ES', opt)}</p>
                        </div>
                        <span class="text-emerald-400 font-bold text-sm">${montosOcultos ? '••••' : '$' + c.costo.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-800/60">
                        <span class="bg-${c.pagado ? 'emerald' : 'red'}-500/10 text-${c.pagado ? 'emerald' : 'red'}-400 border border-${c.pagado ? 'emerald' : 'red'}-500/20 text-[10px] font-semibold px-2.5 py-1 rounded-full">
                            ${c.pagado ? 'Al Día (30d)' : 'Pendiente Pago'}
                        </span>
                        <div class="flex gap-2">
                            <button onclick="abrirExpediente(${c.id})" class="bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition">
                                📂 Expediente
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-gray-800 hover:bg-red-600/20 text-gray-400 hover:text-red-400 p-2 rounded-xl border border-gray-700">🗑️</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });

            document.getElementById('total-clientes').textContent = totalCli;
            document.getElementById('total-meta').textContent = montosOcultos ? '••••' : '$' + metaTotal.toFixed(2);
            document.getElementById('total-recaudado').textContent = montosOcultos ? '••••' : '$' + recaudadoTotal.toFixed(2);
            document.getElementById('total-por-cobrar').textContent = montosOcultos ? '••••' : '$' + porCobrarTotal.toFixed(2);
        }

        // GESTIÓN DE EXPEDIENTES Y MÉTRICAS
        let clienteActualId = null;

        function abrirExpediente(id) {
            clienteActualId = id;
            document.getElementById('vista-principal').classList.add('hidden');
            document.getElementById('vista-expediente').classList.remove('hidden');
            renderizarExpediente();
        }

        function volverAlInicio() {
            clienteActualId = null;
            document.getElementById('vista-expediente').classList.add('hidden');
            document.getElementById('vista-principal').classList.remove('hidden');
            renderizarClientes();
        }

        function renderizarExpediente() {
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;

            const contenedor = document.getElementById('detalle-expediente');
            
            let htmlMetricas = '';
            if (c.metricas && c.metricas.length > 0) {
                c.metricas.forEach((m, idx) => {
                    htmlMetricas += `
                        <div class="bg-[#131b2e] p-4 rounded-xl border border-gray-800 space-y-2 text-xs">
                            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                                <span class="font-bold text-orange-400">📅 Registro: ${m.fecha}</span>
                                <div class="flex gap-1 no-print">
                                    <button onclick="editarMetrica(${idx})" class="bg-gray-800 px-2 py-1 rounded text-gray-300">Editar</button>
                                    <button onclick="eliminarMetrica(${idx})" class="bg-red-900/40 text-red-400 px-2 py-1 rounded">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-1 text-gray-300">
                                <div><b>Peso:</b> ${m.peso} kg</div>
                                <div><b>Estatura:</b> ${m.estatura} cm</div>
                                <div><b>IMC:</b> <span class="text-emerald-400 font-bold">${m.imc}</span></div>
                                <div><b>Cuello:</b> ${m.cuello} cm</div>
                                <div><b>Tórax:</b> ${m.torax} cm</div>
                                <div><b>Bíceps:</b> ${m.biceps} cm</div>
                                <div><b>Abdomen:</b> ${m.abdomen} cm</div>
                                <div><b>Glúteos:</b> ${m.gluteos} cm</div>
                                <div><b>Cuádriceps:</b> ${m.cuadriceps} cm</div>
                                <div><b>Pantorrilla:</b> ${m.pantorrilla} cm</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                htmlMetricas = `<p class="text-gray-500 text-xs text-center py-4">No hay registros antropométricos aún.</p>`;
            }

            contenedor.innerHTML = `
                <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 space-y-3">
                    <h2 class="text-lg font-bold text-white">🏋️‍♂️ Expediente de ${c.nombre}</h2>
                    <div class="grid grid-cols-2 gap-2 text-xs text-gray-300 bg-[#0b0f19] p-3 rounded-xl border border-gray-800">
                        <div><b>Edad:</b> ${c.edad} años</div>
                        <div><b>WhatsApp:</b> ${c.whatsapp}</div>
                        <div><b>Inicio:</b> ${c.fecha}</div>
                        <div><b>Pago Paquete:</b> $${c.costo.toFixed(2)} (${c.pagado ? 'Al día' : 'Pendiente'})</div>
                    </div>
                    <button onclick="toggleEstadoPago(${c.id})" class="w-full bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 font-semibold py-2 rounded-xl text-xs no-print">
                        🔄 Cambiar Estatus de Pago (${c.pagado ? 'Marcar Pendiente' : 'Marcar Pagado'})
                    </button>
                </div>

                <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 space-y-3 no-print">
                    <h3 class="text-sm font-bold text-orange-500 uppercase">📊 Nueva Medición Antropométrica</h3>
                    <form id="form-metrica" onsubmit="guardarMetrica(event)" class="space-y-3 text-xs">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-gray-400">Peso (kg)</label>
                                <input type="number" step="0.1" id="m-peso" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400">Estatura (cm)</label>
                                <input type="number" step="1" id="m-estatura" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                            <div>
                                <label class="text-gray-400">Fecha</label>
                                <input type="date" id="m-fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white">
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <div><label class="text-gray-400">Cuello</label><input type="number" step="0.1" id="m-cuello" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Tórax</label><input type="number" step="0.1" id="m-torax" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Bíceps</label><input type="number" step="0.1" id="m-biceps" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Abdomen</label><input type="number" step="0.1" id="m-abdomen" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Glúteos</label><input type="number" step="0.1" id="m-gluteos" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Cuádriceps</label><input type="number" step="0.1" id="m-cuadriceps" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                            <div><label class="text-gray-400">Pantorrilla</label><input type="number" step="0.1" id="m-pantorrilla" class="w-full bg-[#0b0f19] border border-gray-800 rounded-lg p-2 text-white"></div>
                        </div>
                        <button type="submit" class="w-full bg-orange-600 text-white font-bold py-2 rounded-xl">Registrar y Calcular IMC</button>
                    </form>
                </div>

                <div class="space-y-2">
                    <h3 class="text-sm font-bold text-gray-400 uppercase">📈 Historial y Comparativa Mensual</h3>
                    ${htmlMetricas}
                </div>
            `;
            const mFechaInput = document.getElementById('m-fecha');
            if (mFechaInput) mFechaInput.valueAsDate = new Date();
        }

        function generarPDFExpediente() {
            window.print();
        }

        function toggleEstadoPago(id) {
            const c = cliente
