<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciodarofitness - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: #ffffff !important; color: #000000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-weight: 700 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .bg-slate-900, .bg-slate-800, .bg-slate-950 { background-color: #ffffff !important; border: 2px solid #000000 !important; color: #000000 !important; }
            .text-white, .text-gray-200, .text-gray-300, .text-gray-400 { color: #000000 !important; font-weight: 700 !important; }
            .text-orange-400, .text-orange-500, .text-amber-400 { color: #000000 !important; font-weight: 900 !important; }
            .text-emerald-400 { color: #000000 !important; font-weight: 800 !important; }
            div, span, p, h1, h2, h3, h4, b { color: #000000 !important; font-weight: 700 !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-zinc-950 text-gray-100 min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-6" id="app-container">
        <div id="vista-principal" class="space-y-6">
            <header class="flex justify-between items-center bg-slate-900/90 backdrop-blur-md p-4 rounded-3xl border border-orange-500/20 shadow-xl shadow-black/40">
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-orange-500 to-amber-400 bg-clip-text text-transparent">CIODAROFITNESS <span class="text-xs text-gray-400 font-normal">pro</span></h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="alternarVisibilidadMontos()" id="btn-ojo" class="bg-slate-800 hover:bg-slate-700 text-gray-300 p-2.5 rounded-2xl border border-slate-700/60 text-xs transition shadow">👁️</button>
                    <span class="bg-gradient-to-r from-emerald-500/20 to-teal-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3.5 py-1.5 rounded-full shadow-inner">Activo</span>
                </div>
            </header>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-800 shadow-lg">
                    <div class="text-[11px] text-orange-400/90 uppercase font-bold tracking-wider">Atletas Activos</div>
                    <div id="total-clientes" class="text-3xl font-black mt-2 text-white">0</div>
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-800 shadow-lg">
                    <div class="text-[11px] text-orange-400/90 uppercase font-bold tracking-wider">Meta Mensual</div>
                    <div id="total-meta" class="text-2xl font-black mt-2 text-orange-400">$0.00</div>
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-800 shadow-lg">
                    <div class="text-[11px] text-emerald-400/90 uppercase font-bold tracking-wider">Recaudado</div>
                    <div id="total-recaudado" class="text-2xl font-black mt-2 text-emerald-400">$0.00</div>
                </div>
                <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border border-slate-800 shadow-lg">
                    <div class="text-[11px] text-rose-400/90 uppercase font-bold tracking-wider">Por Cobrar</div>
                    <div id="total-por-cobrar" class="text-2xl font-black mt-2 text-rose-400">$0.00</div>
                </div>
            </div>

            <div class="bg-slate-900/90 backdrop-blur-md p-5 rounded-3xl border border-slate-800 space-y-4 shadow-xl no-print">
                <h2 class="text-xs font-black text-orange-500 uppercase tracking-widest flex items-center gap-2">
                    ⚡ Registrar Nuevo Atleta
                </h2>
                
                <form id="form-cliente" class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 font-semibold block mb-1">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 transition shadow-inner">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-400 font-semibold block mb-1">Edad</label>
                            <input type="number" id="edad" placeholder="Ej. 30" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 transition shadow-inner">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 font-semibold block mb-1">WhatsApp</label>
                            <input type="text" id="whatsapp" required placeholder="Ej. 5841234" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 transition shadow-inner">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-gray-400 font-semibold block mb-1">Costo Paquete ($)</label>
                            <input type="number" id="costo" required placeholder="Ej. 50" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 transition shadow-inner">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 font-semibold block mb-1">Fecha de Inicio</label>
                            <input type="date" id="fecha" required class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white transition shadow-inner">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-3.5 px-4 rounded-2xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-orange-600/30">
                        📂 Agregar a la Base de Datos
                    </button>
                </form>
            </div>

            <div class="space-y-3 no-print">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest flex items-center gap-2">
                        📋 Control de Atletas
                    </h3>
                </div>
                <div>
                    <input type="text" id="buscador-clientes" oninput="renderizarClientes()" placeholder="🔍 Buscar atleta por nombre..." class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 text-sm focus:outline-none focus:border-orange-500 text-white placeholder-gray-600 shadow-lg transition">
                </div>
                <div id="lista-clientes" class="space-y-3"></div>
            </div>
        </div>

        <div id="vista-expediente" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print">
                <button onclick="volverAlInicio()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2.5 rounded-2xl border border-slate-700 transition shadow">
                    ← Volver al Panel
                </button>
                <button onclick="generarPDFExpediente()" class="bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-white text-xs font-bold px-5 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 transition">
                    ⚡ Descargar Expediente Full Color
                </button>
            </div>
            
            <div class="bg-gradient-to-r from-orange-600 via-amber-600 to-orange-500 p-6 rounded-3xl shadow-2xl text-white text-center space-y-1 border border-orange-400/30">
                <h1 class="text-2xl font-black tracking-widest drop-shadow">CIODAROFITNESS</h1>
                <p class="text-xs font-bold uppercase tracking-widest text-orange-100">Expediente Antropométrico & Rendimiento Pro</p>
                <div class="text-[10px] text-orange-200 pt-1 font-medium" id="fecha-impresion"></div>
            </div>

            <div id="detalle-expediente" class="space-y-4"></div>

            <div class="bg-slate-900/90 p-4 rounded-3xl border border-orange-500/30 text-center space-y-1 shadow-xl mt-6">
                <p class="text-xs font-black text-orange-500 tracking-wider">CIODAROFITNESS</p>
                <p class="text-[11px] font-semibold text-gray-400">Entrenamiento Inteligente</p>
            </div>
        </div>
    </div>

    <script>
        const inputFecha = document.getElementById('fecha');
        if (inputFecha) {
            inputFecha.valueAsDate = new Date();
        }

        let clientes = JSON.parse(localStorage.getItem('ciodaro_clientes')) || [];
        let montosOcultos = false;

        function guardarStorage() {
            localStorage.setItem('ciodaro_clientes', JSON.stringify(clientes));
            renderizarClientes();
        }

        function alternarVisibilidadMontos() {
            montosOcultos = !montosOcultos;
            document.getElementById('btn-ojo').textContent = montosOcultos ? '🙈' : '👁️';
            renderizarClientes();
        }

        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombreVal = document.getElementById('nombre').value;
            const edadVal = document.getElementById('edad').value || 'N/A';
            const whatsappVal = document.getElementById('whatsapp').value;
            const costoVal = parseFloat(document.getElementById('costo').value) || 0;
            const fechaVal = document.getElementById('fecha').value;

            const nuevoCliente = {
                id: Date.now(),
                nombre: nombreVal,
                edad: edadVal,
                whatsapp: whatsappVal,
                costo: costoVal,
                fecha: fechaVal,
                pagado: true,
                abonos: [],
                metricas: []
            };

            clientes.push(nuevoCliente);
            guardarStorage();
            
            this.reset();
            document.getElementById('fecha').valueAsDate = new Date();
        });

        function eliminarCliente(id) {
            if(confirm('¿Eliminar este atleta por completo?')) {
                clientes = clientes.filter(c => c.id !== id);
                guardarStorage();
            }
        }
                function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            if (!contenedor) return;
            contenedor.innerHTML = '';
            
            const hoy = new Date();
            const mesActual = hoy.getMonth();
            const anioActual = hoy.getFullYear();

            const inputBusqueda = document.getElementById('buscador-clientes');
            const textoFiltro = inputBusqueda ? inputBusqueda.value.toLowerCase() : '';
            const clientesFiltrados = clientes.filter(c => c.nombre.toLowerCase().includes(textoFiltro));

            let totalCli = clientes.length;
            let metaTotal = 0;
            let recaudadoTotal = 0;
            let porCobrarTotal = 0;

            clientes.forEach(c => {
                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                if (fechaInicio.getMonth() === mesActual && fechaInicio.getFullYear() === anioActual) {
                    metaTotal += c.costo;
                    let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + a.monto, 0);
                    let pagadoReal = c.pagado || (totalAbonado >= c.costo);
                    
                    if (pagadoReal) {
                        recaudadoTotal += c.costo;
                    } else {
                        recaudadoTotal += totalAbonado;
                        porCobrarTotal += (c.costo - totalAbonado);
                    }
                }
            });

            if (clientesFiltrados.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-500 text-sm py-6 bg-slate-900 rounded-3xl border border-slate-800">No se encontraron atletas.</div>`;
                document.getElementById('total-clientes').textContent = totalCli;
                document.getElementById('total-meta').textContent = montosOcultos ? '••••' : '$' + metaTotal.toFixed(2);
                document.getElementById('total-recaudado').textContent = montosOcultos ? '••••' : '$' + recaudadoTotal.toFixed(2);
                document.getElementById('total-por-cobrar').textContent = montosOcultos ? '••••' : '$' + porCobrarTotal.toFixed(2);
                return;
            }

            clientesFiltrados.forEach(c => {
                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                let fechaVenc = new Date(fechaInicio);
                fechaVenc.setDate(fechaVenc.getDate() + 30);
                let opt = { day: '2-digit', month: 'short' };

                let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + a.monto, 0);
                let pagadoReal = c.pagado || (totalAbonado >= c.costo);

                const card = document.createElement('div');
                card.className = "bg-slate-900/90 backdrop-blur-md p-4 rounded-3xl border border-slate-800 space-y-3 shadow-lg";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-base">${c.nombre}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">📅 Ciclo: ${fechaInicio.toLocaleDateString('es-ES', opt)} al ${fechaVenc.toLocaleDateString('es-ES', opt)}</p>
                        </div>
                        <span class="text-emerald-400 font-black text-sm">${montosOcultos ? '••••' : '$' + c.costo.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-800/80">
                        <span class="bg-${pagadoReal ? 'emerald' : 'amber'}-500/10 text-${pagadoReal ? 'emerald' : 'amber'}-400 border border-${pagadoReal ? 'emerald' : 'amber'}-500/20 text-[10px] font-bold px-3 py-1 rounded-full">
                            ${pagadoReal ? 'Al Día (30d)' : `Abonado: $${totalAbonado.toFixed(2)}`}
                        </span>
                        <div class="flex gap-2">
                            <button onclick="abrirExpediente(${c.id})" class="bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white text-xs font-bold px-3.5 py-2 rounded-2xl transition shadow">
                                📂 Expediente
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-slate-800 hover:bg-rose-600/20 text-gray-400 hover:text-rose-400 p-2.5 rounded-2xl border border-slate-700/60 transition shadow">🗑️</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });

            document.getElementById('total-clientes').textContent = totalCli;
            document.getElementById('total-meta').textContent = montosOcultos ? '••••' : '$' + metaTotal.toFixed(2);
            document.getElementById('total-recaudado').textContent = montosOcultos ? '••••' : '$' + recaudadoTotal.toFixed(2);
            document.getElementById('total-por-cobrar').textContent = montosOcultos ? '••••' : '$' + porCobrarTotal.toFixed(2);
        }

        let clienteActualId = null;

        function abrirExpediente(id) {
            clienteActualId = id;
            document.getElementById('vista-principal').classList.add('hidden');
            document.getElementById('vista-expediente').classList.remove('hidden');
            renderizarExpediente();
        }

        function volverAlInicio() {
            clienteActualId = null;
            document.getElementById('vista-expediente').classList.add('hidden');
            document.getElementById('vista-principal').classList.remove('hidden');
            renderizarClientes();
        }

        function renderizarExpediente() {
            const c = clientes.find(item => item.id === clienteActualId);
            if (!c) return;

            const contenedor = document.getElementById('detalle-expediente');
            
            let totalAbonado = (c.abonos || []).reduce((sum, a) => sum + a.monto, 0);
            let saldoPendiente = c.costo - totalAbonado;
            if (saldoPendiente < 0) saldoPendiente = 0;

            let htmlAbonos = '';
            if (c.abonos && c.abonos.length > 0) {
                c.abonos.forEach((abono, idx) => {
                    htmlAbonos += `
                        <div class="flex justify-between items-center bg-slate-950/80 p-3 rounded-2xl border border-slate-800 text-xs shadow-inner">
                            <div>
                                <span class="text-emerald-400 font-black">$${abono.monto.toFixed(2)}</span>
                                <span class="text-gray-400 ml-2 font-medium">📅 ${abono.fecha}</span>
                            </div>
                            <button onclick="eliminarAbono(${idx})" class="text-rose-400 hover:text-rose-300 text-[10px] bg-rose-950/40 px-2.5 py-1 rounded-xl font-bold no-print border border-rose-900/30">Eliminar</button>
                        </div>
                    `;
                });
            } else {
                htmlAbonos = `<p class="text-gray-500 text-xs text-center py-2">No hay abonos registrados aún.</p>`;
            }

            let htmlMetricas = '';
            if (c.metricas && c.metricas.length > 0) {
                c.metricas.forEach((m, idx) => {
                    htmlMetricas += `
                        <div class="bg-slate-900/90 p-4 rounded-3xl border border-orange-500/30 space-y-2 text-xs shadow-xl">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                <span class="font-black text-orange-400 text-sm">📅 Registro: ${m.fecha}</span>
                                <div class="flex gap-1.5 no-print">
                                    <button onclick="editarMetrica(${idx})" class="bg-slate-800 px-2.5 py-1 rounded-xl text-gray-300 font-semibold border border-slate-700">Editar</button>
                                    <button onclick="eliminarMetrica(${idx})" class="bg-rose-950/40 text-rose-400 px-2.5 py-1 rounded-xl font-semibold border border-rose-900/30">Eliminar</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2.5 pt-1 text-gray-200 font-medium">
                                <div><b>Peso:</b> <span class="text-orange-300 font-bold">${m.peso} kg</span></div>
                                <div><b>Estatura:</b> ${m.estatura} cm</div>
                                <div><b>IMC:</b> <span class="text-emerald-400 font-black bg-emerald-500/10 px-2 py-0.5 rounded-lg">${m.imc}</span></div>
                                <div><b>Cuello:</b> ${m.cuello} cm</div>
                                <div><b>Tórax:</b> ${m.torax} cm</div>
                                <div><b>Bíceps:</b> ${m.biceps} cm</div>
                                <div><b>Abdomen:</b> ${m.abdomen} cm</div>
                                <div><b>Glúteos:</b> ${m.gluteos} cm</div>
                                <div><b>Cuádriceps:</b> ${m.cuadriceps} cm</div>
                                <div><b>Pantorrilla:</b> ${m.pantorrilla} cm</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                htmlMetricas = `<p class="text-gray-500 text-xs text-center py-4">No hay registros antropométricos aún.</p>`;
            }

            const numeroLimpio = c.whatsapp.replace(/\D/g, '');
            const mensajeWp = encodeURIComponent(`¡Hola ${c.nombre}! Te escribo de Ciodarofitness para recordarte tu fecha de vencimiento y estatus de pago de tu plan. 💪🔥`);
            const linkWhatsApp = `https://wa.me/${numeroLimpio}?text=${mensajeWp}`;

            contenedor.innerHTML = `
                <div class="bg-slate-900/90 p-5 rounded-3xl border border-orange-500/40 space-y-3 shadow-2xl">
                    <h2 class="text-lg font-black text-white flex items-center gap-2">🏋️‍♂️ Atleta: <span class="text-orange-400">${c.nombre}</span></h2>
                    <div class="grid grid-cols-2 gap-2.5 text-xs text-gray-200 bg-slate-950/80 p-4 rounded-2xl border border-slate-800 shadow-inner">
                        <div><b>Edad:</b> ${c.edad} años</div>
                        <div><b>WhatsApp:</b> ${c.whatsapp}</div>
                        <div><b>Inicio:</b> ${c.fecha}</div>
                        <div><b>Paquete:</b> $${c.costo.toFixed(2)}</div>
                        <div class="col-span-2 pt-1.5 border-t border-slate-800 flex justify-between items-center">
                            <span><b>Estatus:</b> <span class="${c.pagado ? 'text-emerald-400 font-black' : 'text-amber-400 font-bold'}">${c.pagado ? 'Pagado Total (Al día)' : `Restante: $${saldoPendiente.toFixed(2)}`}</span></span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5 no-print">
                        <button onclick="toggleEstadoPago(${c.id})" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 font-bold py-2.5 rounded-2xl text-xs transition hover:bg-emerald-600/30">
                            🔄 (${c.pagado ? 'Marcar Pendiente' : 'Marcar Pago Total'})
                        </button>
                        <a href="${linkWhatsApp}" target="_blank" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 px-3 rounded-2xl text-xs text-center flex items-center justify-center gap-1.5 shadow-lg transition">
                            💬 Enviar WhatsApp
                        </a>
                    </div>
                </div>

                <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 space-y-3 shadow-xl">
                    <h3 class="text-xs font-black text-orange-500 uppercase tracking-widest">💵 Registrar Abono Parcial</h3>
                    <form onsubmit="agregarAbono(event)" class="space-y-3 text-xs no-print">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div>
                                <label class="text-gray-400 font-semibold block mb-1">Monto Abono ($)</label>
                                <input type="number" step="0.1" id="monto-abono" required placeholder="Ej. 20" class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3 text-white shadow-inner">
                            </div>
                            <div>
                                <label class="text-gray-400 font-semibold block mb-1">📅 Fecha del Abono</label>
                                <input type="date" id="fecha-abono" required class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-3 text-white shadow-inner">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-3 rounded-2xl transition shadow-md">Agregar Abono</button>
                    </form>
                    <div class="space-y-2 pt-2 border-t border-slate-800">
                        <h4 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Historial de Abonos:</h4>
                        ${htmlAbonos}
                    </div>
                </div>

                <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 space-y-3 shadow-xl no-print">
                    <h3 class="text-xs font-black text-orange-500 uppercase tracking-widest">📊 Nueva Medición Antropométrica</h3>
                    <form id="form-metrica" onsubmit="guardarMetrica(event)" class="space-y-3 text-xs">
                        <div class="grid grid-cols-3 gap-2.5">
                            <div>
                                <label class="text-gray-400 font-semibold">Peso (kg)</label>
                                <input type="number" step="0.1" id="m-peso" required class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-2.5 text-white shadow-inner">
                            </div>
                            <div>
                                <label class="text-gray-400 font-semibold">Estatura (cm)</label>
                                <input type="number" step="1" id="m-estatura" required class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-2.5 text-white shadow-inner">
                            </div>
                            <div>
                                <label class="text-gray-400 font-semibold">Fecha</label>
                                <input type="date" id="m-fecha" required class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-2.5 text-white shadow-inner">
                            </div>
                        </div>
