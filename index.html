<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiodaroFitness | Panel de Control Premium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            500: '#ef4444', // Rojo principal
                            600: '#dc2626', // Rojo hover
                            700: '#b91c1c', // Rojo activo
                        },
                        zinc: {
                            850: '#202022',
                            950: '#121214', // Fondo ultra oscuro premium
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Fuente Inter (opcional pero recomendada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Ajuste sutil para el scrollbar en modo oscuro */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121214; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen font-sans antialiased">

    <!-- Header Mejorado -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-500 p-2.5 rounded-xl shadow-lg shadow-brand-500/20">
                   <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.83 14.83a9.5 9.5 0 01-5.66 0M9 12a3 3 0 116 0 3 3 0 01-6 0zm9.967-3.971A9.75 9.75 0 0120.5 12a9.75 9.75 0 01-3.033 6.971m-12.867 0A9.75 9.75 0 013.5 12a9.75 9.75 0 013.033-6.971M4 9.75V12m16-2.25V12"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-white tracking-tight">CiodaroFitness</h1>
                    <p class="text-xs text-zinc-400 uppercase tracking-wider font-medium">Gestión de Atletas</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <div class="text-zinc-400">Atletas: <span id="total-students" class="font-bold text-white text-base">0</span></div>
                <button class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl flex items-center gap-2 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Ajustes
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container Refinado -->
    <main class="max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <!-- Columna Izquierda: Formulario (Más estilizado) -->
        <aside class="lg:col-span-4 xl:col-span-3 space-y-8">
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-7 shadow-2xl shadow-black/10 sticky top-28">
                <h2 class="text-xl font-bold mb-6 text-white flex items-center gap-3">
                    <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    Ficha de Atleta
                </h2>
                
                <form id="student-form" class="space-y-5">
                    <input type="hidden" id="student-id">
                    
                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Nombre Completo</label>
                        <input type="text" id="name" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition" placeholder="Ej. Carlos Rodríguez">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Teléfono</label>
                            <input type="text" id="phone" placeholder="58412..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Estatus Pago</label>
                            <select id="payment-status" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-3 text-white focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition cursor-pointer appearance-none bg-no-repeat" style="background-position: right 1rem center; background-image: url('data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'%2352525b\'%3E%3Cpath stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M19 9l-7 7-7-7\'%3E%3C/path%3E%3C/svg%3E'); background-size: 1rem;">
                                <option value="Al Día">Al Día</option>
                                <option value="Pendiente">Pendiente</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Peso (kg)</label>
                            <input type="number" step="0.1" id="weight" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition" placeholder="75.0">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Altura (cm)</label>
                            <input type="number" id="height" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition" placeholder="180">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">IMC</label>
                            <input type="text" id="imc-display" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3 text-zinc-400 text-sm font-bold bg-zinc-800/50" placeholder="0.0">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-zinc-500 mb-2 tracking-wider">Notas / Objetivos</label>
                        <textarea id="notes" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-sm transition resize-none" placeholder="Hipertrofia, fuerza..."></textarea>
                    </div>

                    <div class="flex gap-3 pt-3">
                        <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 px-6 rounded-xl text-sm transition-all shadow-lg shadow-brand-600/20 hover:shadow-brand-600/40 flex items-center justify-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            Guardar Atleta
                        </button>
                        <button type="button" id="reset-form" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3.5 px-5 rounded-xl text-sm transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- Columna Derecha: Tabla y Filtros (Diseño de Tabla Premium) -->
        <section class="lg:col-span-8 xl:col-span-9 bg-zinc-900 border border-zinc-800 rounded-3xl p-7 shadow-2xl shadow-black/10 flex flex-col">
