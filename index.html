<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiodaroFitness - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-4">

    <div class="max-w-md mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
            <div>
                <h1 class="text-xl font-black tracking-wider text-orange-500">CIODAROFITNESS <span class="text-xs text-gray-400 font-normal">page</span></h1>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold px-3 py-1.5 rounded-full">Panel Activo</span>
        </header>

        <!-- Métricas -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                <div class="text-xs text-gray-400 uppercase font-semibold flex justify-between items-center">
                    Clientes Activos 
                    <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <div id="total-clientes" class="text-3xl font-bold mt-2">0</div>
            </div>
            <div class="bg-[#131b2e] p-4 rounded-2xl border border-gray-800">
                <div class="text-xs text-gray-400 uppercase font-semibold flex justify-between items-center">
                    Ingresos Mensuales 
                    <span class="text-emerald-400 font-bold">$</span>
                </div>
                <div id="total-ingresos" class="text-3xl font-bold mt-2 text-emerald-400">$0.00</div>
            </div>
        </div>

        <!-- Formulario Registro -->
        <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 space-y-4">
            <h2 class="text-sm font-bold text-orange-500 uppercase tracking-wide flex items-center gap-2">
                👤 Registrar Nuevo Cliente
            </h2>
            
            <form id="form-cliente" class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Número de WhatsApp (con código de país)</label>
                    <input type="text" id="whatsapp" required placeholder="Ej. 584123456789" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Costo del Paquete ($)</label>
                        <input type="number" id="costo" required placeholder="Ej. 50" class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Fecha de Inicio</label>
                        <input type="date" id="fecha" required class="w-full bg-[#0b0f19] border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 text-white">
                    </div>
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-orange-600/20">
                    📂 Agregar a la Base de Datos
                </button>
            </form>
        </div>

        <!-- Control de Clientes -->
        <div class="space-y-3">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wide flex items-center gap-2">
                📋 Control de Clientes y Vencimientos
            </h3>
            <div id="lista-clientes" class="space-y-3">
                <!-- Aquí se cargan dinámicamente los atletas -->
            </div>
        </div>
    </div>

    <script>
        // Inicializar fecha de hoy por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        let clientes = JSON.parse(localStorage.getItem('ciodaro_clientes')) || [];

        function guardarClientes() {
            localStorage.setItem('ciodaro_clientes', JSON.stringify(clientes));
            renderizarClientes();
        }

        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nuevoCliente = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                whatsapp: document.getElementById('whatsapp').value,
                costo: parseFloat(document.getElementById('costo').value),
                fecha: document.getElementById('fecha').value
            };

            clientes.push(nuevoCliente);
            guardarClientes();
            this.reset();
            document.getElementById('fecha').valueAsDate = new Date();
        });

        function eliminarCliente(id) {
            clientes = clientes.filter(c => c.id !== id);
            guardarClientes();
        }

        function notificarCobro(nombre, whatsapp) {
            const mensaje = encodeURIComponent(`Hola ${nombre}, te escribo de Ciodarofitness para recordarte el pago de tu paquete de entrenamiento.`);
            window.open(`https://wa.me/${whatsapp}?text=${mensaje}`, '_blank');
        }

        function renderizarClientes() {
            const contenedor = document.getElementById('lista-clientes');
            const elTotalClientes = document.getElementById('total-clientes');
            const elTotalIngresos = document.getElementById('total-ingresos');
            
            contenedor.innerHTML = '';
            elTotalClientes.textContent = clientes.length;

            let ingresosTotales = 0;

            if (clientes.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-500 text-sm py-6 bg-[#131b2e] rounded-2xl border border-gray-800">No hay atletas registrados todavía.</div>`;
                elTotalIngresos.textContent = '$0.00';
                return;
            }

            clientes.forEach(c => {
                ingresosTotales += c.costo;

                // Calcular vencimiento (30 días)
                let fechaInicio = new Date(c.fecha + 'T00:00:00');
                let fechaVencimiento = new Date(fechaInicio);
                fechaVencimiento.setDate(fechaVencimiento.getDate() + 30);
                
                let options = { day: '2-digit', month: 'short' };
                let fInicioStr = fechaInicio.toLocaleDateString('es-ES', options);
                let fVencStr = fechaVencimiento.toLocaleDateString('es-ES', options);

                const card = document.createElement('div');
                card.className = "bg-[#131b2e] p-4 rounded-2xl border border-gray-800 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-base">${c.nombre}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">📅 Ciclo: ${fInicioStr} al ${fVencStr}</p>
                        </div>
                        <span class="text-emerald-400 font-bold text-sm">$${c.costo.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-800/60">
                        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-semibold px-2.5 py-1 rounded-full">Activo (30d)</span>
                        <div class="flex gap-2">
                            <button onclick="notificarCobro('${c.nombre}', '${c.whatsapp}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1.5">
                                💬 Notificar Cobro
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-gray-800 hover:bg-red-600/20 text-gray-400 hover:text-red-400 p-2 rounded-xl transition border border-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });

            elTotalIngresos.textContent = `$${ingresosTotales.toFixed(2)}`;
        }

        renderizarClientes();
    </script>
</body>
</html>
